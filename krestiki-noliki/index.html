<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Пиратские крестики-нолики" />
    <title>Крестики-нолики в пиратском море</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="game-card" aria-labelledby="game-title">
        <header class="masthead">
          <p class="eyebrow">✦ бортовой журнал · рейс № 03 ✦</p>
          <h1 id="game-title">Крестики-нолики<br /><em>в пиратском море</em></h1>
          <p class="subtitle">Капитан против штурмана. Кто первым захватит три клетки?</p>
        </header>
        <nav class="mode-tabs" aria-label="Режим игры">
          <button class="mode-tab active" data-mode="bot" type="button">⚓ Компьютер</button>
          <button class="mode-tab" data-mode="duel" type="button">☠ Вдвоём</button>
          <button class="mode-tab" data-mode="online" type="button">◉ Онлайн</button>
        </nav>
        <section class="online-panel" id="online-panel" hidden>
          <div class="online-copy"><strong>Открыть свой стол</strong><span>Создайте комнату и отправьте другу код или ссылку.</span></div>
          <div class="online-actions">
            <button class="primary-button" id="create-room" type="button">Создать комнату</button>
            <label class="join-field"><span>Код стола</span><input id="room-code" maxlength="24" placeholder="например, AB12" autocomplete="off" /></label>
            <button class="secondary-button" id="join-room" type="button">Присоединиться</button>
          </div>
          <div class="room-share" id="room-share" hidden><span>Код для друга: <strong id="room-code-display"></strong></span><button id="copy-link" type="button">Копировать ссылку</button></div>
        </section>
        <section class="settings" id="bot-settings" aria-label="Настройки компьютера">
          <label>Сложность<select id="difficulty"><option value="deckhand">Юнга · ошибается</option><option value="captain">Морской волк · без ошибок</option></select></label>
        </section>
        <section class="scoreboard" aria-label="Счет игры">
          <div class="crew crew-x"><span class="crew-mark">X</span><div><small>Капитан</small><strong id="score-x">0</strong></div></div>
          <div class="turn-indicator" id="turn-indicator" aria-live="polite">Ходит X</div>
          <div class="crew crew-o"><div><small>Штурман</small><strong id="score-o">0</strong></div><span class="crew-mark">O</span></div>
        </section>
        <div class="board-wrap"><div class="board" id="board" role="grid" aria-label="Игровое поле"></div></div>
        <p class="status" id="status" aria-live="polite">Ваш ход, капитан</p>
        <div class="footer-actions"><button class="new-game" id="new-game" type="button">Сыграть ещё</button><span class="connection" id="connection">● локальная партия</span></div>
      </section>
    </main>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
